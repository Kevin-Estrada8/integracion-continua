name: Integracion Continua Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Verificar Docker Compose
        run: docker compose version

      - name: Validar configuracion
        run: docker compose config

      - name: Construir y probar comunicacion
        run: |
          docker compose up \
            --build \
            --abort-on-container-exit \
            --exit-code-from contenedor_uno

      - name: Limpiar contenedores
        if: always()
        run: docker compose down --volumes --remove-orphans

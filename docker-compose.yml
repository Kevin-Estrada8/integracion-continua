services:
  contenedor_dos:
    build: ./contenedor_dos
    container_name: servicio_dos
    networks:
      - red-interna
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5

  contenedor_uno:
    build: ./contenedor_uno
    container_name: servicio_uno
    networks:
      - red-interna
    depends_on:
      contenedor_dos:
        condition: service_healthy

networks:
  red-interna:
    driver: bridge